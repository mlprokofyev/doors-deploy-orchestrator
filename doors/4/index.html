<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Perun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Cormorant&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000000;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-title {
      color: #e0e0e0;
      font-family: "Ruslan Display", system-ui, -apple-system, sans-serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
      max-width: 90vw;
      text-align: center;
    }
    #loading-bar-bg {
      width: min(320px, 60vw);
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      overflow: hidden;
    }
    #loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #EB8C33;
      border-radius: 5px;
      transition: width 0.15s ease;
    }
    #loading-percent {
      color: #EB8C33;
      font-family: "Ruslan Display", system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      margin-top: 1rem;
    }
    #loading-subtitle {
      color: #9a9a9a;
      font-family: "Cormorant", Georgia, serif;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-top: 2.5rem;
    }
    #loading-wait-note {
      color: #9a9a9a;
      font-family: "Cormorant", Georgia, serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-top: 1.25rem;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #loading-wait-note.visible {
      opacity: 1;
    }
    #block-message {
      color: #e0e0e0;
      font-family: "Cormorant", Georgia, serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
      max-width: min(480px, 80vw);
      text-align: center;
      line-height: 1.5;
    }
    #back-to-hub {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      color: rgba(224, 224, 224, 0.35);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    #back-to-hub:hover {
      color: rgba(224, 224, 224, 0.85);
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-title">Door 4, knock-knock</div>
    <div id="loading-bar-bg"><div id="loading-bar-fill"></div></div>
    <div id="loading-percent">0%</div>
    <div id="loading-subtitle">*вдохновлено славянской мифологией*</div>
    <div id="loading-wait-note">(да, придётся немного подождать, игра весит целых 55МВ)</div>
  </div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <a id="back-to-hub" href="/doors" aria-label="Back to hub">&larr; Doors</a>
  <script>
    // Collect all AudioContexts Unity creates so we can resume them on first user gesture
    (function () {
      var pendingContexts = [];
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      function Patched() {
        var ctx = new Orig();
        if (ctx.state === "suspended") pendingContexts.push(ctx);
        return ctx;
      }
      Patched.prototype = Orig.prototype;
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;

      function resumeAll() {
        pendingContexts.forEach(function (c) { if (c.state === "suspended") c.resume(); });
        pendingContexts = [];
        document.removeEventListener("click", resumeAll);
        document.removeEventListener("keydown", resumeAll);
        document.removeEventListener("touchstart", resumeAll);
      }
      document.addEventListener("click", resumeAll);
      document.addEventListener("keydown", resumeAll);
      document.addEventListener("touchstart", resumeAll);
    })();
  </script>
  <script>
    var overlay = document.getElementById("loading-overlay");

    function isMobileOrTablet() {
      if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
      var ua = navigator.userAgent || "";
      if (/Android|iPhone|iPad|iPod|Windows Phone|IEMobile|Opera Mini|Mobile|Tablet|Silk/i.test(ua)) return true;
      // iPadOS reports itself as Macintosh but is the only "Mac" with multi-touch
      if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
      return false;
    }

    function bootGame() {
      var fill = document.getElementById("loading-bar-fill");
      var percent = document.getElementById("loading-percent");

      setTimeout(function () {
        if (!overlay.classList.contains("hidden")) {
          document.getElementById("loading-wait-note").classList.add("visible");
        }
      }, 15000);

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl:            "Build/WebGL-Prod.data.unityweb",
        frameworkUrl:       "Build/WebGL-Prod.framework.js.unityweb",
        codeUrl:            "Build/WebGL-Prod.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "Perun",
        productName:        "Perun",
        productVersion:     "0.1.0",
        matchWebGLToCanvasSize: true,
      }, function (progress) {
        var pct = Math.round(progress * 100);
        fill.style.width = pct + "%";
        percent.textContent = pct + "%";
      }).then(function (instance) {
        overlay.classList.add("hidden");
        setTimeout(function () { overlay.remove(); }, 500);
      }).catch(function (message) {
        alert(message);
      });
    }

    if (isMobileOrTablet()) {
      document.getElementById("loading-title").remove();
      document.getElementById("loading-bar-bg").remove();
      document.getElementById("loading-percent").remove();
      document.getElementById("loading-subtitle").remove();
      document.getElementById("loading-wait-note").remove();
      var blockMessage = document.createElement("div");
      blockMessage.id = "block-message";
      blockMessage.textContent = "Работает только с компа. Мобильной версии не будет :(";
      overlay.appendChild(blockMessage);
    } else {
      var loaderScript = document.createElement("script");
      loaderScript.src = "Build/WebGL-Prod.loader.js";
      loaderScript.onload = bootGame;
      document.body.appendChild(loaderScript);
    }
  </script>
</body>
</html>
